name: Integration

on:
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on main.
    branches: [main, 'ci/**']
  schedule:
    - cron: '53 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# The integration test is example/integration_test/plugin_integration_test.dart.
# It runs the camera pipeline when the host has a camera and otherwise checks
# that the plugin refuses to open one.
jobs:
  # Desktop: the jobs share the steps of the first (YAML anchor). GitHub
  # runners have no camera, so the pipeline runs only in the job with the
  # fake V4L2 device (ci/fake_v4l2.c, LD_PRELOAD).
  desktop-macos-arm64:
    name: macOS ARM64
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVICE: macos
    steps: &desktop_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - working-directory: example
        run: flutter pub get
      # flutter_barcode_sdk_macos ships dylibs with broken install names (e.g.
      # libDynamicPdf.dylib identifies as @loader_path/..., and
      # libDynamsoftNeuralNetwork.dylib has a bare name), so any app linking
      # them crashes at launch. Normalize all ids and internal references to
      # @rpath form and re-sign ad-hoc.
      - if: runner.os == 'macOS'
        run: |
          pub_cache="${PUB_CACHE:-$HOME/.pub-cache}"
          LIBDIR=$(dirname "$(find "$pub_cache/hosted/pub.dev" -name "libDynamicPdf.dylib" -path "*flutter_barcode_sdk_macos*" | head -1)")
          echo "Patching dylibs in $LIBDIR"
          for f in "$LIBDIR"/*.dylib; do
            for ref in $(otool -L "$f" | awk 'NR>2 {print $1}'); do
              case "$ref" in
                @rpath/*|/usr/lib/*|/System/*|@executable_path/*) ;;
                *) install_name_tool -change "$ref" "@rpath/$(basename "$ref")" "$f" || true ;;
              esac
            done
            install_name_tool -id "@rpath/$(basename "$f")" "$f" || true
            codesign --force --sign - "$f" || true
          done
      # Launching a desktop app on the macOS runner occasionally fails with
      # "Unable to start the app on the device"; retry a few times.
      - name: Integration tests
        uses: Telosnex/telosnex_ci_tools/actions/watch@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        with:
          working-directory: example
          idle-minutes: '15'
          run: |
            for i in 1 2 3; do
              flutter test integration_test -d "$DEVICE" -r expanded && exit 0
              echo "Attempt $i failed, retrying..."
              sleep 10
            done
            exit 1

  desktop-windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      DEVICE: windows
    steps: *desktop_steps

  desktop-linux-x64:
    name: Linux x64 fake camera
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEVICE: linux
      FAKE_CAMERA: 'true'
    steps: &linux_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      # libpipewire-0.3-dev makes CMake build the camera portal (Flatpak)
      # backend, which is the fork's change; without it only V4L2 is built.
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libpipewire-0.3-dev xvfb build-essential > /dev/null
      - name: Build the fake V4L2 device shim
        if: env.FAKE_CAMERA == 'true'
        run: gcc -shared -fPIC -O2 -o "$RUNNER_TEMP/fake_v4l2.so" ci/fake_v4l2.c -ldl
      - working-directory: example
        run: flutter pub get
      - name: Integration tests
        uses: Telosnex/telosnex_ci_tools/actions/watch@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        with:
          working-directory: example
          idle-minutes: '15'
          run: |
            run=(flutter test integration_test -d "$DEVICE" -r expanded)
            if [[ "$FAKE_CAMERA" == true ]]; then
              export LD_PRELOAD="$RUNNER_TEMP/fake_v4l2.so"
            fi
            xvfb-run -a "${run[@]}"

  # No camera at all: the plugin must report no devices and refuse to open.
  desktop-linux-x64-no-camera:
    name: Linux x64 no camera
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEVICE: linux
      FAKE_CAMERA: 'false'
    steps: *linux_steps

  # The Flatpak path with no portal on the host: the plugin must fall back to
  # no camera without hanging or crashing.
  desktop-linux-x64-no-camera-portal:
    name: Linux x64 no camera portal
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEVICE: linux
      FAKE_CAMERA: 'false'
      FLUTTER_LITE_CAMERA_PORTAL: '1'
    steps: *linux_steps
